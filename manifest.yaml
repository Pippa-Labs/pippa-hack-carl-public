# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
#
# Replace everything below with your own app. The example describes a small
# "days until" app so you can see the shape of each part.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "CarlC"

app:
  # Must match the repository: Pippa-Labs/pippa-hack-carl-public.
  id: hack.carl_public
  name: London Recycling
  # Bump this (0.1.0 -> 0.1.1) after you press Submit for review.
  version: 0.1.0
  # Never use the word "b-y" here: the badge is split on it.
  summary: >-
    Finds the nearest household reuse and recycling centre to a London
    postcode or area, and says which borough council collects your recycling
    and where to check your collection day. It sends only the postcode or
    place you mention to postcodes.io and OpenStreetMap.

agent_types:
  - personal

outcomes:
  - id: recycling.nearest_centre
    summary: Find the closest London reuse and recycling centre (the tip) to a postcode or area
    example_phrases:
      - where is my nearest recycling centre
      - closest tip to me in london
      - nearest household waste recycling centre
      - where can i take old furniture to the tip
      - nearest reuse and recycling centre to e8
      - where can i dump garden waste near clapham
      - which recycling centre is closest to my postcode
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          The London postcode (full like "E8 1EA" or district like "SW11"),
          neighbourhood or borough the user named, exactly as they wrote it.
          If the message names no place or postcode, return an empty string
          rather than guessing.
    output:
      - name: location_used
        type: string
        description: The postcode or place the distances were measured from.
      - name: centre_name
        type: string
        description: Name of the nearest reuse and recycling centre.
      - name: centre_postcode
        type: string
        required: false
        description: The centre's postcode, when known.
      - name: centre_borough
        type: string
        description: The London borough the centre is in.
      - name: distance_km
        type: number
        description: Straight-line distance to the centre in kilometres.
      - name: map_link
        type: string
        description: An OpenStreetMap link to the centre.
      - name: other_nearby
        type: array
        item_type: string
        description: The next closest centres, with borough and distance.

  - id: recycling.collection_day
    summary: Say which London borough collects recycling at a postcode and where to check the bin day
    example_phrases:
      - when is my recycling collected
      - what day are my bins collected
      - when is bin day for my postcode
      - which council collects my recycling
      - when do the recycling bins go out in hackney
      - recycling collection day for sw11
      - what day is rubbish collection on my street
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          The London postcode (full like "E8 1EA" or district like "SW11"),
          neighbourhood or borough the user named, exactly as they wrote it.
          If the message names no place or postcode, return an empty string
          rather than guessing.
    output:
      - name: location_used
        type: string
        description: The postcode or place that was looked up.
      - name: borough
        type: string
        description: The London borough council that collects recycling there.
      - name: council_website
        type: string
        description: That council's recycling or main web page.
      - name: bin_day_finder
        type: string
        description: GOV.UK's official page for finding the exact collection day from a postcode.
      - name: other_possible_boroughs
        type: array
        item_type: string
        description: Other boroughs a postcode district also covers; empty when the answer is certain.
